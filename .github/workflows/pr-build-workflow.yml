name: Build Pull Request
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build pull request
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'liberica'
          cache: 'maven'

      - name: Build
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./mvnw --batch-mode --update-snapshots verify -Ddisable.checks=true -Dtest='${{ inputs.test-filter }}' -Dsurefire.failIfNoSpecifiedTests=false
          else
            ./mvnw --batch-mode --update-snapshots verify -Ddisable.checks=true
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-retry-jar
          path: target/spring-retry-*[0-9].jar
          if-no-files-found: error
